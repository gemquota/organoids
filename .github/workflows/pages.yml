name: Deploy Organoids to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'accretion.html'
      - 'hitchhikers-guide.html'
      - 'assets/**'
      - 'src/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    env:
      PAGES_ARTIFACT_NAME: pages-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Run automated checks
        run: |
          npm test
          node scripts/check-inline.mjs
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Assemble the two-experience site
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site/src _site/assets
          cp accretion.html _site/index.html
          cp hitchhikers-guide.html _site/hitchhikers-guide.html
          cp -R src/. _site/src/
          cp -R assets/atlas _site/assets/
          touch _site/.nojekyll
          test -s _site/index.html
          test -s _site/hitchhikers-guide.html
          test -s _site/assets/atlas/entities.svg
          test ! -e _site/emergent-life-atlas.html
          test ! -e _site/experiments
          test ! -e _site/archive
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
          name: ${{ env.PAGES_ARTIFACT_NAME }}
      - name: Wait for artifact metadata to propagate
        run: sleep 8
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: ${{ env.PAGES_ARTIFACT_NAME }}
