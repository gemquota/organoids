export class SpatialIndex{

  key(x,y){return Math.floor(x/this.cell)+','+Math.floor(y/this.cell)}
  rebuild(entities){this.buckets.clear();for(const e of entities){if(e.state!=='active')continue;const p=e.properties;if(!Number.isFinite(p.x)||!Number.isFinite(p.y))continue;const k=this.key(p.x,p.y);if(!this.buckets.has(k))this.buckets.set(k,[]);this.buckets.get(k).push(e)}return this}

export class FieldGrid{
  constructor(cols,rows,width=cols,height=rows){this.cols=cols;this.rows=rows;this.width=width;this.height=height;this.fields=new Map()}

  sample(name,x,y){return this.fields.get(name)[this.index(x,y)]}
  take(name,x,y,value){const a=this.fields.get(name),i=this.index(x,y),n=Math.min(Math.max(0,value),Math.max(0,a[i]));a[i]-=n;return n}

export class EnergyEngine{
  constructor(fields){this.fields=fields;this.ledger={input:0,transferred:0,converted:0,output:0,fielded:0}}

export class GraphEngine{
  constructor(store){this.store=store}

export class RuleEngine{
  constructor(options={}){this.rules=[];this.random=options.random||Math.random;this.energy=options.energy;this.events=[]}

export class Scheduler{

}
function createRuntime(options={}){const store=new EntityStore(),fields=new FieldGrid(options.cols||64,options.rows||36,options.width||640,options.height||360),energy=new EnergyEngine(fields),spatial=new SpatialIndex(options.cellSize||24),interactions=new PairEngine(),constraints=interactions,rules=new RuleEngine({random:options.random,energy}),graph=new GraphEngine(store),topology=graph,scheduler=new Scheduler();fields.define('heat');scheduler.add('reactions',(dt)=>rules.run(store,dt),options.reactionPriority??10).add('field-diffusion',()=>fields.diffuse('heat',options.diffusion??.08),options.fieldPriority??20);return{store,energy,fields,spatial,interactions,constraints,rules,graph,topology,scheduler,step(dt=1){spatial.rebuild(store.entities.values());interactions.apply(store,spatial,dt);constraints.solve(store,options.constraintIterations||1);for(const e of store.entities.values()){if(e.state!=='active')continue;const p=e.properties;p.vx=num(p.vx);p.vy=num(p.vy);p.x=num(p.x)+p.vx*dt;p.y=num(p.y)+p.vy*dt}scheduler.step(dt,this);return this}}}
