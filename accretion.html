const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));const num=(v,d=0)=>Number.isFinite(+v)?+v:d;const clone=v=>structuredClone(v);const V={add:(a,b)=>({x:a.x+b.x,y:a.y+b.y}),sub:(a,b)=>({x:a.x-b.x,y:a.y-b.y}),scale:(a,s)=>({x:a.x*s,y:a.y*s}),len:a=>Math.hypot(a.x,a.y),norm:a=>{const n=Math.hypot(a.x,a.y)||1;return{x:a.x/n,y:a.y/n}}};class EntityStore{constructor(){this.entities=new Map();this.links=[];this.next=1}create(type,properties={},options={}){const e={id:this.next++,type,properties:{...properties},state:options.state??'active',energy:num(options.energy),parent:null,children:[]};this.entities.set(e.id,e);return e}get(id){return this.entities.get(id)}remove(id){const e=this.get(id);if(!e)return false;if(e.parent){const p=this.get(e.parent);if(p)p.children=p.children.filter(x=>x!==id)}const share=e.children.length?e.energy/e.children.length:0;for(const c of e.children){const child=this.get(c);if(child){child.parent=null;child.state='active';child.energy+=share}}this.links=this.links.filter(l=>l.a!==id&&l.b!==id);return this.entities.delete(id)}compose(parent,child){const p=this.get(parent),c=this.get(child);if(!p||!c||p===c)throw Error('Invalid composition');for(let n=p;n;n=n.parent?this.get(n.parent):null)if(n.id===child)throw Error('Composition cycle');if(c.parent){const old=this.get(c.parent);if(old)old.children=old.children.filter(x=>x!==child)}c.parent=parent;c.state='bound';if(!p.children.includes(child))p.children.push(child);return p}link(a,b,type='bond',properties={}){if(!this.get(a)||!this.get(b)||a===b)throw Error('Invalid relationship');if(!this.links.some(l=>l.a===a&&l.b===b&&l.type===type))this.links.push({a,b,type,properties:{...properties}});return this}unlink(a,b,type){this.links=this.links.filter(l=>!(l.a===a&&l.b===b&&(!type||l.type===type))&&!(l.a===b&&l.b===a&&(!type||l.type===type)));return this}descendants(id){const out=[],visit=n=>{for(const c of this.get(n)?.children||[]){out.push(c);visit(c)}};visit(id);return out}snapshot(){return{next:this.next,entities:[...this.entities.values()].map(clone),links:clone(this.links)}}static restore(s){const store=new EntityStore();store.next=s.next;store.entities=new Map(s.entities.map(e=>[e.id,clone(e)]));store.links=clone(s.links);return store}}class SpatialIndex{constructor(cell=32){this.cell=Math.max(1,cell);this.buckets=new Map()}key(x,y){return Math.floor(x/this.cell)+','+Math.floor(y/this.cell)}rebuild(entities){this.buckets.clear();for(const e of entities){if(e.state!=='active')continue;const p=e.properties;if(!Number.isFinite(p.x)||!Number.isFinite(p.y))continue;const k=this.key(p.x,p.y);if(!this.buckets.has(k))this.buckets.set(k,[]);this.buckets.get(k).push(e)}return this}query(x,y,r){const out=[],c=this.cell;for(let iy=Math.floor((y-r)/c);iy<=Math.floor((y+r)/c);iy++)for(let ix=Math.floor((x-r)/c);ix<=Math.floor((x+r)/c);ix++)for(const e of this.buckets.get(ix+','+iy)||[])if(Math.hypot(e.properties.x-x,e.properties.y-y)<=r)out.push(e);return out}}class FieldGrid{constructor(cols,rows,width=cols,height=rows){this.cols=cols;this.rows=rows;this.width=width;this.height=height;this.fields=new Map()}define(name,initial=0){this.fields.set(name,new Float32Array(this.cols*this.rows).fill(initial));return this}index(x,y){return clamp(Math.floor(y/this.height*this.rows),0,this.rows-1)*this.cols+clamp(Math.floor(x/this.width*this.cols),0,this.cols-1)}add(name,x,y,value){this.fields.get(name)[this.index(x,y)]+=value;return this}sample(name,x,y){return this.fields.get(name)[this.index(x,y)]}diffuse(name,rate){const a=this.fields.get(name),b=Float32Array.from(a),k=clamp(rate)*.25;for(let y=0;y<this.rows;y++)for(let x=0;x<this.cols;x++){const i=y*this.cols+x;for(const j of [x+1<this.cols?i+1:-1,y+1<this.rows?i+this.cols:-1])if(j>=0){const f=(a[j]-a[i])*k;b[i]+=f;b[j]-=f}}this.fields.set(name,b);return this}}class InteractionEngine{constructor(rules=[]){this.rules=rules.map(clone)}register(rule){this.rules.push(clone(rule));return this}apply(store,index,dt=1){const force=new Map();for(const r of this.rules){for(const a of store.entities.values()){if(a.state!=='active'||(r.a!=='*'&&a.type!==r.a))continue;const p=a.properties;for(const b of index.query(p.x,p.y,r.radius)){if(a.id===b.id||b.state!=='active'||(r.b!=='*'&&b.type!==r.b)||((r.a===r.b||r.a==='*'&&r.b==='*')&&b.id<=a.id))continue;const q=b.properties,dx=q.x-p.x,dy=q.y-p.y,d=Math.hypot(dx,dy)||.0001;if(d>r.radius)continue;const sign=r.mode==='repel'?-1:1,m=(1-d/r.radius)*num(r.strength,1)*sign*dt,fx=dx/d*m,fy=dy/d*m;for(const [e,x,y] of [[a,fx,fy],[b,-fx,-fy]]){const f=force.get(e.id)||{x:0,y:0};f.x+=x;f.y+=y;force.set(e.id,f)}}}}for(const [id,f] of force){const p=store.get(id).properties,m=Math.max(.001,num(p.mass,1));p.vx=num(p.vx)+f.x/m;p.vy=num(p.vy)+f.y/m}return force.size}}class ConstraintEngine{constructor(constraints=[]){this.constraints=constraints.map(clone)}add(c){this.constraints.push(clone(c));return this}solve(store,iterations=1){for(let n=0;n<iterations;n++)for(const c of this.constraints){const a=store.get(c.a)?.properties,b=store.get(c.b)?.properties;if(!a||!b)continue;const dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy)||.0001,err=(d-num(c.rest))/d*clamp(num(c.stiffness,1)),ia=1/Math.max(.001,num(a.mass,1)),ib=1/Math.max(.001,num(b.mass,1)),sum=ia+ib;a.x+=dx*err*ia/sum;a.y+=dy*err*ia/sum;b.x-=dx*err*ib/sum;b.y-=dy*err*ib/sum}return this}}class EnergyEngine{constructor(){this.ledger={input:0,transferred:0,converted:0,output:0}}source(e,n){n=Math.max(0,num(n));e.energy+=n;this.ledger.input+=n;return n}transfer(a,b,n){n=clamp(n,0,Math.max(0,a.energy));a.energy-=n;b.energy+=n;this.ledger.transferred+=n;return n}convert(e,n,efficiency=1){n=clamp(n,0,Math.max(0,e.energy));const out=n*clamp(efficiency);e.energy+=out-n;this.ledger.converted+=n-out;this.ledger.output+=n-out;return out}dissipate(e,n){n=clamp(n,0,Math.max(0,e.energy));e.energy-=n;this.ledger.output+=n;return n}}class GraphEngine{constructor(store){this.store=store}neighbours(id,type){return this.store.links.filter(l=>(l.a===id||l.b===id)&&(!type||l.type===type)).map(l=>l.a===id?l.b:l.a)}components(type){const nodes=[...this.store.entities.values()].filter(e=>!type||e.type===type),seen=new Set(),out=[];for(const e of nodes)if(!seen.has(e.id)){const group=[],stack=[e.id];seen.add(e.id);while(stack.length){const id=stack.pop();group.push(id);for(const n of this.neighbours(id))if(!seen.has(n)&&(!type||this.store.get(n)?.type===type)){seen.add(n);stack.push(n)}}out.push(group)}return out}hasCycle(ids){const set=new Set(ids),seen=new Set();const visit=(id,parent)=>{seen.add(id);for(const n of this.neighbours(id))if(set.has(n)){if(!seen.has(n)){if(visit(n,id))return true}else if(n!==parent)return true}return false};for(const id of ids)if(!seen.has(id)&&visit(id,null))return true;return false}}class RuleEngine{constructor(options={}){this.rules=[];this.random=options.random||Math.random;this.energy=options.energy;this.events=[]}register(r){if(!r.id||!Array.isArray(r.inputs)||!Array.isArray(r.outputs))throw Error('Rule requires id,inputs and outputs');this.rules.push(clone(r));return this}match(e,s){if(!e)return false;if(typeof s==='string')return e.type===s;return e.type===(s.type||e.type)&&Object.entries(s.where||{}).every(([k,v])=>e.properties[k]===(typeof v==='object'?v.value:v))}run(store,dt=1){let count=0;for(const r of this.rules){if(this.random()>1-Math.exp(-Math.max(0,num(r.rate,1))*Math.max(0,dt)))continue;const pool=[...store.entities.values()].filter(e=>e.state==='active'),used=new Set(),chosen=[];for(const s of r.inputs){const e=pool.find(x=>!used.has(x.id)&&this.match(x,s));if(!e){chosen.length=0;break}chosen.push(e);used.add(e.id)}if(chosen.length!==r.inputs.length)continue;const catalysts=(r.catalysts||[]).map(s=>pool.find(e=>this.match(e,s)));if(catalysts.some(e=>!e))continue;if((r.conditions||[]).some(c=>{const v=chosen[c.input||0]?.properties[c.property];return c.op==='gt'?!(v>c.value):c.op==='eq'?v!==c.value:!(v>=c.value)}))continue;const cost=Math.max(0,num(r.energyCost)),payer=chosen[0];if(cost&&(!payer||payer.energy<cost))continue;if(cost){payer.energy-=cost;this.energy&&(this.energy.ledger.output+=cost)}const energy=Math.max(0,num(r.productEnergy,chosen.reduce((s,e)=>s+e.energy,0)));chosen.forEach(e=>store.remove(e.id));const products=r.outputs.map(o=>store.create(o.type,o.properties||{},{energy:energy/Math.max(1,r.outputs.length)}));this.events.push({rule:r.id,inputs:chosen.map(e=>e.id),outputs:products.map(e=>e.id)});count++}return count}}class TopologyEngine{constructor(store){this.store=store;this.graph=new GraphEngine(store)}assemble(type,ids,properties={}){const root=this.store.create(type,properties);for(const id of ids)this.store.compose(root.id,id);return root}closed(id){const ids=[id,...this.store.descendants(id)];return ids.length>2&&this.graph.hasCycle(ids)}divide(id,groups){const parent=this.store.get(id);if(!parent)throw Error('Unknown entity');return groups.map(group=>this.assemble(parent.type,group,parent.properties))}}class Scheduler{constructor(){this.phases=[];this.time=0;this.tick=0}add(name,fn,priority=0){this.phases.push({name,fn,priority,order:this.phases.length});this.phases.sort((a,b)=>a.priority-b.priority||a.order-b.order);return this}step(dt,context){for(const p of this.phases)p.fn(dt,context);this.time+=dt;this.tick++;return this}}function createRuntime(options={}){const store=new EntityStore(),energy=new EnergyEngine(),fields=new FieldGrid(options.cols||64,options.rows||36,options.width||640,options.height||360),spatial=new SpatialIndex(options.cellSize||24),interactions=new InteractionEngine(),constraints=new ConstraintEngine(),rules=new RuleEngine({random:options.random,energy}),graph=new GraphEngine(store),topology=new TopologyEngine(store),scheduler=new Scheduler();return{store,energy,fields,spatial,interactions,constraints,rules,graph,topology,scheduler,step(dt=1){spatial.rebuild(store.entities.values());interactions.apply(store,spatial,dt);constraints.solve(store,options.const const canvas=document.querySelector('#c'),g=canvas.getContext('2d'),hud=document.querySelector('#hud');
let W,H,frame=0,last=0;
function resize(){const dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=W*dpr;canvas.height=H*dpr;g.setTransform(dpr,0,0,dpr,0,0)}
addEventListener('resize',resize);resize();
const sim=createRuntime({width:W,height:H,cols:80,rows:45,cellSize:24,constraintIterations:2});
sim.interactions
 .register({id:'long-range-cohesion',a:'*',b:'*',radius:150,strength:.045,mode:'attract'})
 .register({id:'short-range-exclusion',a:'*',b:'*',radius:10,strength:.28,mode:'repel'});
for(let i=0;i<800;i++)sim.store.create('particle',{x:Math.random()*W,y:Math.random()*H,vx:0,vy:0,mass:1},{energy:.2});
function merge(){const entities=[...sim.store.entities.values()],seen=new Set();for(const a of entities){if(seen.has(a.id)||a.state!=='active'||!sim.store.get(a.id))continue;const p=a.properties;for(const b of sim.spatial.query(p.x,p.y,180)){if(b.id<=a.id||seen.has(b.id)||b.state!=='active')continue;const q=b.properties,d=Math.hypot(q.x-p.x,q.y-p.y),limit=3*(Math.sqrt(p.mass)+Math.sqrt(q.mass));if(d>=limit)continue;const m=p.mass+q.mass,root=sim.store.create('molecule',{x:(p.x*p.mass+q.x*q.mass)/m,y:(p.y*p.mass+q.y*q.mass)/m,vx:(p.vx*p.mass+q.vx*q.mass)/m,vy:(p.vy*p.mass+q.vy*q.mass)/m,mass:m},{energy:a.energy+b.energy});sim.store.compose(root.id,a.id);sim.store.compose(root.id,b.id);a.energy=0;b.energy=0;seen.add(a.id);seen.add(b.id);break}}}
function step(now){const dt=Math.min(.035,(now-last)/1000||.016);last=now;frame++;
 sim.step(dt*60);
 for(const e of sim.store.entities.values()){if(e.state!=='active')continue;const p=e.properties;p.vx*=.994;p.vy*=.994;if(p.x<0||p.x>W)p.vx*=-.8;if(p.y<0||p.y>H)p.vy*=-.8;p.x=Math.max(0,Math.min(W,p.x));p.y=Math.max(0,Math.min(H,p.y));sim.energy.source(e,.00008);if(frame%3===0)sim.energy.dissipate(e,.00008)}
 if(frame%2===0){sim.spatial.rebuild(sim.store.entities.values());merge()}
 g.fillStyle='rgba(5,9,12,.24)';g.fillRect(0,0,W,H);for(const e of sim.store.entities.values()){if(e.state!=='active')continue;const p=e.properties,r=3*Math.sqrt(p.mass);g.fillStyle=e.type==='molecule'?'#b0a6ed':'#72d9d0';g.globalAlpha=.55+Math.min(.4,p.mass/35);g.beginPath();g.arc(p.x,p.y,r,0,Math.PI*2);g.fill()}
 g.globalAlpha=1;hud.textContent='ORGANOIDS // UNIFIED EMERGENCE\nentities '+sim.store.entities.size+'   ticks '+sim.scheduler.tick+'\nenergy dissipated '+sim.energy.ledger.output.toFixed(3);
 requestAnimationFrame(step)}
requestAnimationFrame(step);
