function card(d){const next=edges.filter(e=>e[0]===d[0]).map(e=>e[1]);const status=d[5]==="Established"?"Established":"Possible";const art=ART[d[0]]||"organoid";const color=colorFor(d[2]);return '<article class="entity-card" style="--cat:'+color+'" id="entity-'+d[0]+'" data-entity-card data-status="'+d[5]+'" data-chapter="'+d[2]+'"><svg class="entity-art" viewBox="0 0 480 480" role="img" aria-label="'+esc(d[1])+' illustration"><use href="assets/atlas/entities.svg#entity-'+art+'"></use></svg><div class="entity-copy"><div class="entity-top"><h3>'+esc(d[1])+'</h3><span class="evidence '+(d[5]==="Established"?"":"possible")+'">'+status+'</span></div><p class="summary">'+esc(d[3])+'</p><div class="meta">SCALE '+d[6]+' · '+esc(chapter(d[0])[1])+'</div><div class="mechanism"><strong>Mechanism</strong><p>'+esc(d[4])+'</p></div><div class="relations"><div class="relation"><span class="relation-label">From</span>'+links(d[8],"Foundational")+'</div><div class="relation"><span class="relation-label">To</span>'+links(next,"—")+'</div></div><div class="tags">'+d[7].map(t=>'<span class="tag">'+esc(t)+'</span>').join("")+'</div></div></article>'}
function renderGuide(){const nav=document.getElementById("chapter-nav");nav.innerHTML=C.map(c=>'<button type="button" data-category="'+c[0]+'" style="--cat:'+colorFor(c[0])+'" aria-pressed="true">'+esc(c[1])+'</button>').join("");document.getElementById("encyclopedia").innerHTML=C.map((c,i)=>{const items=D.filter(d=>d[2]===c[0]);return '<section class="chapter" id="chapter-'+c[0]+'" data-chapter-section style="--cat:'+colorFor(c[0])+'"><div class="chapter-head"><span class="chapter-swatch"></span><h2>'+esc(c[1])+'</h2><span class="chapter-count">'+items.length+'</span></div><div class="entity-grid">'+items.map(card).join("")+'</div></section>'}).join("");document.getElementById("entity-total").textContent=D.length+" ENTITIES · "+C.length+" CATEGORIES";document.getElementById("map-legend").innerHTML=C.map(c=>'<span class="legend-item" style="--cat:'+colorFor(c[0])+'"><i class="legend-dot"></i>'+esc(c[1])+'</span>').join("")}
function renderMap(){const colW=190,nodeW=150,nodeH=42,gapY=24,left=34,top=64;const W=left*2+C.length*colW,H=Math.max(520,...C.map(c=>D.filter(d=>d[2]===c[0]).length))*(nodeH+gapY)+top+40,pos={};C.forEach((c,i)=>{const items=D.filter(d=>d[2]===c[0]).sort((a,b)=>a[6]-b[6]);items.forEach((d,j)=>{pos[d[0]]={x:left+i*colW+(colW-nodeW)/2,y:top+j*(nodeH+gapY)}})});let out="";edges.forEach(e=>{if(pos[e[0]]&&pos[e[1]]){const a=pos[e[0]],b=pos[e[1]],x1=a.x+nodeW,y1=a.y+nodeH/2,x2=b.x,y2=b.y+nodeH/2,dx=Math.max(24,(x2-x1)*.45);out+='<path class="map-edge" fill="none" d="M '+x1+' '+y1+' C '+(x1+dx)+' '+y1+' '+(x2-dx)+' '+y2+' '+x2+' '+y2+'"/>'}});C.forEach((c,i)=>{const x=left+i*colW+colW/2;out+='<text x="'+x+'" y="28" fill="'+colorFor(c[0])+'" font-size="13" font-weight="700" text-anchor="middle">'+esc(c[1])+'</text><line x1="'+(left+i*colW+12)+'" y1="40" x2="'+(left+(i+1)*colW-12)+'" y2="40" stroke="'+colorFor(c[0])+'" opacity=".55"/>'});D.forEach(d=>{const p=pos[d[0]],color=colorFor(d[2]);out+='<a class="map-node" href="#entity-'+d[0]+'" aria-label="Jump to '+esc(d[1])+'"><g><rect x="'+p.x+'" y="'+p.y+'" width="'+nodeW+'" height="'+nodeH+'" fill="'+color+'"/><text x="'+(p.x+nodeW/2)+'" y="'+(p.y+nodeH/2+4)+'" text-anchor="middle">'+esc(d[1].length>21?d[1].slice(0,19)+"…":d[1])+'</text></g></a>'});const svg=document.getElementById("network");svg.setAttribute("viewBox","0 0 "+W+" "+H);svg.style.minWidth=W+"px";svg.style.minHeight=H+"px";svg.innerHTML=out}
let activeCategory="all";function applyFilters(){const q=document.getElementById("search").value.trim().toLowerCase(),statuses=[...document.querySelectorAll(".filters input:checked")].map(x=>x.value);let shown=0;document.querySelectorAll("[data-entity-card]").forEach(el=>{const d=byId.get(el.id.slice(7));const match=d.join(" ").toLowerCase().includes(q)&&statuses.includes(d[5])&&(activeCategory==="all"||d[2]===activeCategory);el.classList.toggle("empty",!match);if(match)shown++});document.querySelectorAll("[data-chapter-section]").forEach(section=>section.classList.toggle("empty",!section.querySelector("[data-entity-card]:not(.empty)")));document.querySelectorAll("[data-category]").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.category===activeCategory||activeCategory==="all")));document.getElementById("result-count").textContent=shown+"/"+D.length}
renderGuide();renderMap();document.getElementById("search").addEventListener("input",applyFilters);document.querySelectorAll(".filters input").forEach(input=>input.addEventListener("change",applyFilters));document.getElementById("chapter-nav").addEventListener("click",event=>{const b=event.target.closest("[data-category]");if(!b)return;activeCategory=activeCategory===b.dataset.category?"all":b.dataset.category;applyFilters()});applyFilters();
</script></body></html>
